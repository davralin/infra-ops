---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name wastebin
  namespace: flux-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: wastebin
    namespace: flux-system
  driftDetection:
    mode: enabled
  targetNamespace: wastebin
  install:
    createNamespace: false
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      wastebin:
        containers:
          wastebin:
            image:
              repository: docker.io/quxfoo/wastebin
              tag: 3.7.2@sha256:8ad3a7b7a757b3df9483c3e512ae98fd8e2a0c785205dd1dd20ac521fca91479
            env:
              WASTEBIN_DATABASE_PATH: /data/state.db
              WASTEBIN_ADDRESS_PORT: "0.0.0.0:8088"
              TMPDIR: /tmp
            probes:
              liveness: &probes
                enabled: true
              readiness: *probes
              startup: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    service:
      wastebin:
        controller: *name
        ports:
          http:
            port: &port 8088
    persistence:
      data:
        enabled: true
        existingClaim: wastebin
      tmp:
        enabled: true
        type: emptyDir
    rawResources:
      network-policy:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            endpointSelector:
              matchLabels:
                app.kubernetes.io/controller: *name
            ingress:
              - fromEndpoints:
                  - matchLabels:
                      k8s:io.kubernetes.pod.namespace: cloudflared
                      app.kubernetes.io/controller: cloudflared
                toPorts:
                  - ports:
                      - port: "8088"
                        protocol: TCP
              - fromEndpoints:
                  - matchLabels:
                      k8s:io.kubernetes.pod.namespace: prometheus
                      k8s:app.kubernetes.io/name: prometheus
                toPorts:
                  - ports:
                      - port: "8088"
                        protocol: TCP
