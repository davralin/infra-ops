---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: flux-system
  driftDetection:
    mode: enabled
  targetNamespace: prometheus
  install:
    createNamespace: false
    crds: Skip
    remediation:
      retries: 10
  upgrade:
    crds: Skip
    remediation:
      retries: 10
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
  values:
    fullnameOverride: kube-prom
    crds:
      enabled: false
    cleanPrometheusOperatorObjectNames: true

    alertmanager:
      alertmanagerSpec:
        retention: 120h
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi

    grafana:
      enabled: false

    kubeApiServer:
      enabled: true

    kubeControllerManager:
      enabled: true
      service:
        selector:
          k8s-app: kube-controller-manager

    kubeEtcd:
      enabled: false

    kubeProxy:
      enabled: false

    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler

    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
        - nodes=[*]
      prometheus:
        monitor:
          enabled: true
          metrics:
            relabelings:
              - action: replace
                regex: (.*)
                replacement: $1
                sourceLabels: ["__meta_kubernetes_pod_node_name"]
                targetLabel: kubernetes_node

    nodeExporter:
      enabled: false
      forceDeployDashboards: true
      operatingSystems:
        aix:
          enabled: false
        darwin:
          enabled: false

    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    prometheus:
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        retention: 14d
        retentionSize: 16GB
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ${STORAGE_READWRITEONCE}
              resources:
                requests:
                  storage: 20Gi
