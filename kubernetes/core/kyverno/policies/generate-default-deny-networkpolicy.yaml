---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-default-deny-networkpolicy
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
        scope: Cluster
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        object.metadata.name != 'kube-system' &&
        object.metadata.name != 'kyverno'
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: default-deny
            namespace: (( object.metadata.name ))
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
